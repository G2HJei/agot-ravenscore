<!DOCTYPE html>
<html id="rootHtml" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" lang="en" data-bs-theme="dark"
      class="fixed-height-page">
<head>
    <title> Ravenscore Tourney Tracker</title>
    <meta name="description" content="Ravenscore: Track your AGoT BG tournaments">
    <meta name=”robots” content="index, nofollow">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <th:block th:if="${@environment.getProperty('ravenscore.cdn.enabled')}">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.min.css">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
    </th:block>
    <th:block th:unless="${@environment.getProperty('ravenscore.cdn.enabled')}">
        <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/dist/css/bootstrap.min.css}">
        <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.0/font/bootstrap-icons.css}">
        <script th:src="@{/webjars/bootstrap/5.3.3/dist/js/bootstrap.bundle.js}"></script>
        <script th:src="@{/webjars/jquery/3.7.1/dist/jquery.js}"></script>
        <script th:src="@{/webjars/sortablejs/1.15.6/Sortable.min.js}"></script>
        <script th:src="@{/webjars/chart.js/4.4.7/dist/chart.umd.js}"></script>
        <script th:src="@{/webjars/chartjs-plugin-datalabels/2.2.0/dist/chartjs-plugin-datalabels.min.js}"></script>
    </th:block>
    <link rel="stylesheet" th:href="@{/ravenscore.css}">


</head>
<body class="d-flex flex-column justify-content-start min-vh-100">
<div layout:replace="~{layout/header}"></div>
<section id="layoutContainer" class="container-fluid container-rs mt-3">
    <div layout:replace="~{layout/cookies}"></div>
    <main layout:fragment="content"></main>
</section>
<div layout:replace="~{layout/footer}"></div>
<script th:inline="javascript">
    const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
    const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl));

    $(document).on('focus', 'input[type=number]', function () {
        this.select();
    });
</script>
</body>
</html>
