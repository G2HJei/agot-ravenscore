# In-memory H2 standing in for PostgreSQL (the Flyway URL, user and password follow these values)
spring.datasource.url=jdbc:h2:mem:ravenscore;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Swords & Ravens: ravenscore.snr.api-url points to WireMock (see AcceptanceTestBase), the scheduled job is disabled
ravenscore.snr.last-active-job.cron=-
# Third-party CSS and JS come from webjars rather than jsDelivr, so the tests do not depend on the CDN
ravenscore.cdn.enabled=false
spring.main.banner-mode=off
